<header class="site-header">
  <div class="site-container">
    <div class="site-branding">
      <a href="{{ '/' | relative_url }}" class="site-title">
        {{ site.title }}
      </a>
      <p class="site-tagline">{{ site.tagline }}</p>
    </div>
    
    <nav class="site-nav" role="navigation" aria-label="Main navigation">
      {% for link in site.nav_links %}
        <a href="{{ link.url | relative_url }}" {% if page.url == link.url %}aria-current="page"{% endif %}>
          {{ link.title }}
        </a>
      {% endfor %}
    </nav>
  </div>
</header>

<style>
.site-branding {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

@media (max-width: 768px) {
  .site-branding {
    align-items: center;
    text-align: center;
  }
}
</style>
