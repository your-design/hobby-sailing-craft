# Site settings
title: "Open-Source Expedition Proa"
tagline: "3000 Years of Ocean Wisdom, Reimagined for Modern Lakes"
description: "A fully open-source, CNC-cut sailing proa optimized for fishing, family sailing, and expedition camping. Standing on the shoulders of Micronesian giants."
baseurl: ""
url: "https://expedition-proa.org"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  designs:
    output: true
    permalink: /designs/:name/
  build_guides:
    output: true
    permalink: /build/:name/
  history:
    output: true
    permalink: /history/:name/
  configurations:
    output: true
    permalink: /configurations/:name/

# Navigation
nav_links:
  - title: "Why Proa?"
    url: /why-proa/
  - title: "Design"
    url: /designs/
  - title: "Build Guides"
    url: /build/
  - title: "History"
    url: /history/
  - title: "Download Files"
    url: /downloads/
  - title: "Community"
    url: /community/

# Project info
project:
  version: "0.1.0-alpha"
  status: "Active Development"
  license: "CC BY-SA 4.0"
  repository: "https://github.com/expedition-proa/osep-16"
  
# Author
author:
  name: "Expedition Proa Project"
  email: "contact@expedition-proa.org"

# Defaults
defaults:
  - scope:
      path: ""
      type: "designs"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "build_guides"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "history"
    values:
      layout: "page"
