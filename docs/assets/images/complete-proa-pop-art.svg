<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Complete Proa Assembly - Pop Art Catalog Style -->
  
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    
    <!-- Water pattern -->
    <pattern id="water" x="0" y="0" width="40" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,5 Q10,0 20,5 Q30,10 40,5" stroke="#0066CC" fill="none" stroke-width="2"/>
    </pattern>
    
    <!-- Sun burst -->
    <radialGradient id="sunburst">
      <stop offset="0%" style="stop-color:#FFFF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:0.5" />
    </radialGradient>
  </defs>
  
  <rect width="1400" height="1000" fill="url(#skyGrad)"/>
  
  <!-- Sun in corner -->
  <circle cx="1250" cy="100" r="80" fill="url(#sunburst)" stroke="#FF6B35" stroke-width="6"/>
  
  <!-- Title Banner -->
  <rect x="50" y="30" width="1300" height="120" fill="#FF1493" stroke="#000" stroke-width="8"/>
  <text x="700" y="95" font-family="Impact" font-size="56" 
        fill="#FFFF00" text-anchor="middle" font-weight="bold">
    OSEP-16 EXPEDITION PROA
  </text>
  <text x="700" y="130" font-family="Arial" font-size="24" 
        fill="#FFF" text-anchor="middle" font-weight="bold">
    FISH • SAIL • EXPLORE • 3000 YEARS OF PACIFIC WISDOM
  </text>
  
  <!-- Water line -->
  <rect x="0" y="650" width="1400" height="350" fill="#00CED1"/>
  <rect x="0" y="650" width="1400" height="350" fill="url(#water)"/>
  
  <!-- Complete Proa Assembly -->
  <g id="proa-assembly" transform="translate(200, 400)">
    
    <!-- Main Hull (Vaka) -->
    <g id="main-hull">
      <!-- Hull body -->
      <path d="M 100,200 Q 250,180 500,175 Q 750,180 900,200 
               L 920,220 L 900,235 Q 750,250 500,255 Q 250,250 100,235 L 80,220 Z"
            fill="#0066CC" stroke="#000" stroke-width="6"/>
      
      <!-- Waterline on hull -->
      <line x1="100" y1="220" x2="900" y2="220" stroke="#FFF" 
            stroke-width="3" stroke-dasharray="10,5"/>
      
      <!-- Pylon mounts (where crossbeams attach) -->
      <rect x="300" y="170" width="20" height="40" fill="#FF6B35" 
            stroke="#000" stroke-width="3"/>
      <rect x="680" y="170" width="20" height="40" fill="#FF6B35" 
            stroke="#000" stroke-width="3"/>
    </g>
    
    <!-- Crossbeams (Akas) -->
    <g id="crossbeams">
      <!-- Forward aka -->
      <rect x="310" y="50" width="300" height="15" fill="#C0C0C0" 
            stroke="#000" stroke-width="4"/>
      
      <!-- Aft aka -->
      <rect x="690" y="50" width="300" height="15" fill="#C0C0C0" 
            stroke="#000" stroke-width="4"/>
            
      <!-- Connection lines to main hull -->
      <line x1="310" y1="65" x2="310" y2="180" stroke="#000" 
            stroke-width="3" stroke-dasharray="5,5"/>
      <line x1="690" y1="65" x2="690" y2="180" stroke="#000" 
            stroke-width="3" stroke-dasharray="5,5"/>
    </g>
    
    <!-- Ama (Outrigger) -->
    <g id="ama">
      <ellipse cx="775" cy="57" rx="200" ry="40" 
               fill="#00CED1" stroke="#000" stroke-width="5"/>
      
      <!-- Deck detail -->
      <line x1="650" y1="45" x2="900" y2="45" stroke="#FFF" 
            stroke-width="2" stroke-dasharray="5,3"/>
    </g>
    
    <!-- Trampoline (mesh between hulls) -->
    <g id="trampoline">
      <!-- Mesh pattern -->
      <pattern id="mesh" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="20" y2="0" stroke="#666" stroke-width="1"/>
        <line x1="0" y1="0" x2="0" y2="20" stroke="#666" stroke-width="1"/>
      </pattern>
      
      <path d="M 320,70 L 680,70 L 690,175 L 310,175 Z"
            fill="url(#mesh)" fill-opacity="0.6" stroke="#000" stroke-width="3"/>
    </g>
    
    <!-- Mast -->
    <g id="mast">
      <rect x="495" y="-180" width="10" height="355" fill="#8B4513" 
            stroke="#000" stroke-width="4"/>
      
      <!-- Mast top -->
      <circle cx="500" cy="-180" r="8" fill="#FFD700" stroke="#000" stroke-width="2"/>
    </g>
    
    <!-- Crab Claw Sail -->
    <g id="sail">
      <!-- Sail shape - asymmetric triangle -->
      <path d="M 500,-170 L 650,0 L 500,150 L 400,0 Z"
            fill="#FF6B35" fill-opacity="0.9" stroke="#000" stroke-width="6"/>
      
      <!-- Sail panels/seams -->
      <line x1="500" y1="-170" x2="575" y2="75" stroke="#000" 
            stroke-width="2" stroke-dasharray="10,5"/>
      <line x1="500" y1="-170" x2="450" y2="75" stroke="#000" 
            stroke-width="2" stroke-dasharray="10,5"/>
      
      <!-- Yard (curved spar) -->
      <path d="M 400,0 Q 500,-20 650,0" stroke="#8B4513" 
            stroke-width="8" fill="none"/>
      
      <!-- Boom -->
      <line x1="500" y1="150" x2="500" y2="175" stroke="#8B4513" stroke-width="6"/>
    </g>
    
    <!-- Rudder -->
    <g id="rudder">
      <rect x="890" y="220" width="8" height="50" fill="#8B4513" 
            stroke="#000" stroke-width="2"/>
      <path d="M 890,270 L 905,285 L 898,270" fill="#8B4513" 
            stroke="#000" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Feature Callouts - Comic Style -->
  <g id="callouts">
    <!-- Sail area callout -->
    <g transform="translate(950, 250)">
      <polygon points="0,0 30,-30 20,-10 55,-35 30,0 55,35 20,10 30,30" 
               fill="#FFFF00" stroke="#000" stroke-width="5"/>
      <text x="27" y="-5" font-family="Impact" font-size="18" 
            fill="#FF1493" text-anchor="middle" font-weight="bold">
        140
      </text>
      <text x="27" y="12" font-family="Impact" font-size="18" 
            fill="#FF1493" text-anchor="middle" font-weight="bold">
        SQ FT
      </text>
      <text x="27" y="28" font-family="Impact" font-size="14" 
            fill="#000" text-anchor="middle" font-weight="bold">
        SAIL!
      </text>
    </g>
    
    <!-- Stability callout -->
    <circle cx="150" cy="350" r="80" fill="#00CED1" stroke="#000" stroke-width="6"/>
    <text x="150" y="335" font-family="Impact" font-size="18" 
          fill="#FFF" text-anchor="middle" font-weight="bold">
      ULTRA
    </text>
    <text x="150" y="355" font-family="Impact" font-size="18" 
          fill="#FFF" text-anchor="middle" font-weight="bold">
      STABLE
    </text>
    <text x="150" y="375" font-family="Impact" font-size="14" 
          fill="#FFF" text-anchor="middle">
      STAND and FISH!
    </text>
    
    <!-- Speed callout -->
    <circle cx="1200" cy="500" r="70" fill="#FF1493" stroke="#000" stroke-width="6"/>
    <text x="1200" y="490" font-family="Impact" font-size="20" 
          fill="#FFFF00" text-anchor="middle" font-weight="bold">
      8-12
    </text>
    <text x="1200" y="510" font-family="Impact" font-size="20" 
          fill="#FFFF00" text-anchor="middle" font-weight="bold">
      KNOTS
    </text>
    <text x="1200" y="530" font-family="Impact" font-size="14" 
          fill="#FFF" text-anchor="middle">
      CRUISING!
    </text>
  </g>
  
  <!-- Specifications Panel -->
  <g id="specs" transform="translate(50, 750)">
    <rect x="0" y="0" width="1300" height="200" fill="#FFF" 
          fill-opacity="0.9" stroke="#000" stroke-width="6"/>
    
    <!-- Title -->
    <rect x="20" y="20" width="1260" height="40" fill="#0066CC" stroke="#000" stroke-width="3"/>
    <text x="650" y="48" font-family="Impact" font-size="28" 
          fill="#FFFF00" text-anchor="middle" font-weight="bold">
      SPECIFICATIONS & FEATURES
    </text>
    
    <!-- Three columns of specs -->
    <g id="specs-col1" transform="translate(40, 80)">
      <text x="0" y="0" font-family="Impact" font-size="16" fill="#FF1493">LENGTH:</text>
      <text x="0" y="18" font-family="Arial" font-size="14" fill="#000">16' Main Hull</text>
      
      <text x="0" y="40" font-family="Impact" font-size="16" fill="#FF1493">BEAM:</text>
      <text x="0" y="58" font-family="Arial" font-size="14" fill="#000">10-12' (Adjustable)</text>
      
      <text x="0" y="80" font-family="Impact" font-size="16" fill="#FF1493">WEIGHT:</text>
      <text x="0" y="98" font-family="Arial" font-size="14" fill="#000">200 lbs Total</text>
    </g>
    
    <g id="specs-col2" transform="translate(450, 80)">
      <text x="0" y="0" font-family="Impact" font-size="16" fill="#FF1493">CAPACITY:</text>
      <text x="0" y="18" font-family="Arial" font-size="14" fill="#000">2 Adults + 1 Child</text>
      
      <text x="0" y="40" font-family="Impact" font-size="16" fill="#FF1493">DRAFT:</text>
      <text x="0" y="58" font-family="Arial" font-size="14" fill="#000">6-8" Shallow Water</text>
      
      <text x="0" y="80" font-family="Impact" font-size="16" fill="#FF1493">STORAGE:</text>
      <text x="0" y="98" font-family="Arial" font-size="14" fill="#000">12 Cu Ft Watertight</text>
    </g>
    
    <g id="specs-col3" transform="translate(860, 80)">
      <text x="0" y="0" font-family="Impact" font-size="16" fill="#FF1493">BUILD TIME:</text>
      <text x="0" y="18" font-family="Arial" font-size="14" fill="#000">110 Hours</text>
      
      <text x="0" y="40" font-family="Impact" font-size="16" fill="#FF1493">COST:</text>
      <text x="0" y="58" font-family="Arial" font-size="14" fill="#000">~$3,000 Materials</text>
      
      <text x="0" y="80" font-family="Impact" font-size="16" fill="#FF1493">CONFIGS:</text>
      <text x="0" y="98" font-family="Arial" font-size="14" fill="#000">Solo/Family/Expedition</text>
    </g>
  </g>
  
  <!-- Bottom tagline -->
  <text x="700" y="985" font-family="Impact" font-size="20" 
        fill="#000" text-anchor="middle" font-weight="bold">
    OPEN-SOURCE • BUILD YOUR OWN • CC BY-SA 4.0 • 2025
  </text>
</svg>
