<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- 60s/70s Pop Art Style - Bold colors, high contrast, halftone dots -->
  
  <!-- Background - vibrant yellow -->
  <rect width="1200" height="800" fill="#FFD700"/>
  
  <!-- Title Banner -->
  <rect x="50" y="30" width="1100" height="100" fill="#FF1493" stroke="#000" stroke-width="6"/>
  <text x="600" y="90" font-family="Impact, Arial Black, sans-serif" font-size="48" 
        fill="#FFFF00" text-anchor="middle" font-weight="bold">
    OSEP-16 MAIN HULL
  </text>
  <text x="600" y="115" font-family="Arial, sans-serif" font-size="20" 
        fill="#FFF" text-anchor="middle">
    16' ASYMMETRIC PROA VAKA • REVOLUTIONARY DESIGN
  </text>
  
  <!-- Main Hull Side Profile - Bold Pop Art Style -->
  <g id="hull-profile" transform="translate(100, 200)">
    
    <!-- Hull outline - thick black stroke, bright colors -->
    <!-- Sheer line (top) -->
    <path d="M 50,80 Q 250,60 500,50 Q 750,60 950,80" 
          stroke="#000" stroke-width="8" fill="none"/>
    
    <!-- Keel line (bottom) with rocker -->
    <path d="M 50,80 Q 250,140 500,150 Q 750,140 950,80" 
          stroke="#000" stroke-width="8" fill="none"/>
    
    <!-- Bow -->
    <path d="M 50,80 L 20,100 L 50,120" 
          stroke="#000" stroke-width="8" fill="#FF6B35"/>
    
    <!-- Stern -->
    <path d="M 950,80 L 980,100 L 950,120" 
          stroke="#000" stroke-width="8" fill="#FF6B35"/>
    
    <!-- Fill hull with gradient - pop art blue to cyan -->
    <defs>
      <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#00CED1;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
      </linearGradient>
      
      <!-- Halftone dot pattern for pop art effect -->
      <pattern id="halftone" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="10" cy="10" r="3" fill="#FF1493" opacity="0.3"/>
      </pattern>
    </defs>
    
    <path d="M 50,80 Q 250,60 500,50 Q 750,60 950,80 
             L 980,100 L 950,120 Q 750,140 500,150 Q 250,140 50,120 L 20,100 Z"
          fill="url(#hullGrad)" stroke="#000" stroke-width="6"/>
    
    <!-- Halftone overlay -->
    <path d="M 50,80 Q 250,60 500,50 Q 750,60 950,80 
             L 980,100 L 950,120 Q 750,140 500,150 Q 250,140 50,120 L 20,100 Z"
          fill="url(#halftone)"/>
    
    <!-- Station lines - white dashed -->
    <line x1="150" y1="65" x2="150" y2="135" stroke="#FFF" stroke-width="3" 
          stroke-dasharray="10,5" opacity="0.8"/>
    <line x1="300" y1="58" x2="300" y2="142" stroke="#FFF" stroke-width="3" 
          stroke-dasharray="10,5" opacity="0.8"/>
    <line x1="500" y1="50" x2="500" y2="150" stroke="#FFF" stroke-width="3" 
          stroke-dasharray="10,5" opacity="0.8"/>
    <line x1="700" y1="58" x2="700" y2="142" stroke="#FFF" stroke-width="3" 
          stroke-dasharray="10,5" opacity="0.8"/>
    <line x1="850" y1="65" x2="850" y2="135" stroke="#FFF" stroke-width="3" 
          stroke-dasharray="10,5" opacity="0.8"/>
    
    <!-- Dimension arrows - pop art style -->
    <g id="dimensions">
      <!-- Length dimension -->
      <line x1="50" y1="170" x2="950" y2="170" stroke="#FF1493" stroke-width="4"/>
      <polygon points="50,170 70,165 70,175" fill="#FF1493"/>
      <polygon points="950,170 930,165 930,175" fill="#FF1493"/>
      <text x="500" y="195" font-family="Impact" font-size="24" fill="#000" 
            text-anchor="middle" font-weight="bold">
        16' 0" (192")
      </text>
    </g>
  </g>
  
  <!-- Cross-Section View - Station 5 (Max Beam) -->
  <g id="cross-section" transform="translate(100, 480)">
    
    <!-- Section title -->
    <rect x="350" y="-30" width="300" height="30" fill="#FF6B35" stroke="#000" stroke-width="4"/>
    <text x="500" y="-8" font-family="Impact" font-size="18" fill="#FFF" 
          text-anchor="middle" font-weight="bold">
      SECTION AT STATION 5
    </text>
    
    <!-- Asymmetric cross-section -->
    <!-- Left side (Leeward) - FLAT -->
    <path d="M 500,0 L 350,80 L 340,120 L 500,150" 
          fill="#00CED1" stroke="#000" stroke-width="6"/>
    
    <!-- Right side (Windward) - CURVED -->
    <path d="M 500,0 L 650,80 Q 660,100 660,120 L 500,150" 
          fill="#0066CC" stroke="#000" stroke-width="6"/>
    
    <!-- Halftone patterns -->
    <path d="M 500,0 L 350,80 L 340,120 L 500,150" 
          fill="url(#halftone)"/>
    <path d="M 500,0 L 650,80 Q 660,100 660,120 L 500,150" 
          fill="url(#halftone)"/>
    
    <!-- Centerline -->
    <line x1="500" y1="-10" x2="500" y2="160" stroke="#FF1493" 
          stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- Labels with pop art bursts -->
    <g id="labels">
      <!-- Leeward label -->
      <circle cx="380" cy="100" r="50" fill="#FFFF00" stroke="#000" stroke-width="4"/>
      <text x="380" y="95" font-family="Impact" font-size="14" 
            fill="#000" text-anchor="middle" font-weight="bold">
        LEEWARD
      </text>
      <text x="380" y="110" font-family="Arial" font-size="11" 
            fill="#000" text-anchor="middle">
        FLAT SIDE
      </text>
      
      <!-- Windward label -->
      <circle cx="620" cy="100" r="50" fill="#FF1493" stroke="#000" stroke-width="4"/>
      <text x="620" y="95" font-family="Impact" font-size="14" 
            fill="#FFF" text-anchor="middle" font-weight="bold">
        WINDWARD
      </text>
      <text x="620" y="110" font-family="Arial" font-size="11" 
            fill="#FFF" text-anchor="middle">
        CURVED
      </text>
    </g>
    
    <!-- Beam dimension -->
    <line x1="340" y1="180" x2="660" y2="180" stroke="#FF6B35" stroke-width="4"/>
    <polygon points="340,180 355,175 355,185" fill="#FF6B35"/>
    <polygon points="660,180 645,175 645,185" fill="#FF6B35"/>
    <text x="500" y="205" font-family="Impact" font-size="20" fill="#000" 
          text-anchor="middle" font-weight="bold">
      24" MAX BEAM
    </text>
  </g>
  
  <!-- Feature Callouts - Comic book style -->
  <g id="callouts">
    <!-- Callout 1 -->
    <circle cx="900" cy="320" r="70" fill="#FFFF00" stroke="#000" stroke-width="5"/>
    <text x="900" y="310" font-family="Impact" font-size="16" 
          fill="#000" text-anchor="middle" font-weight="bold">
      NO
    </text>
    <text x="900" y="330" font-family="Impact" font-size="16" 
          fill="#000" text-anchor="middle" font-weight="bold">
      DAGGER-
    </text>
    <text x="900" y="350" font-family="Impact" font-size="16" 
          fill="#000" text-anchor="middle" font-weight="bold">
      BOARD!
    </text>
    
    <!-- Callout 2 -->
    <circle cx="200" cy="320" r="70" fill="#FF6B35" stroke="#000" stroke-width="5"/>
    <text x="200" y="310" font-family="Impact" font-size="16" 
          fill="#FFF" text-anchor="middle" font-weight="bold">
      BEACH
    </text>
    <text x="200" y="330" font-family="Impact" font-size="16" 
          fill="#FFF" text-anchor="middle" font-weight="bold">
      LAUNCH-
    </text>
    <text x="200" y="350" font-family="Impact" font-size="16" 
          fill="#FFF" text-anchor="middle" font-weight="bold">
      ABLE!
    </text>
  </g>
  
  <!-- Speed burst graphic -->
  <g id="speed-burst" transform="translate(1000, 600)">
    <polygon points="0,0 30,-30 20,-10 50,-30 25,0 50,30 20,10 30,30" 
             fill="#FFFF00" stroke="#000" stroke-width="4"/>
    <text x="25" y="5" font-family="Impact" font-size="20" 
          fill="#FF1493" text-anchor="middle" font-weight="bold">
      FAST!
    </text>
  </g>
  
  <!-- Copyright/Designer mark -->
  <text x="600" y="780" font-family="Arial" font-size="14" 
        fill="#000" text-anchor="middle">
    OSEP-16 Open-Source Expedition Proa • CC BY-SA 4.0 • 2025
  </text>
</svg>
