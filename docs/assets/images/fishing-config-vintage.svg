<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Vintage Outdoor Catalog Style - Fishing Configuration -->
  
  <defs>
    <!-- Vintage paper texture -->
    <pattern id="paper" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#F4E8D0"/>
      <circle cx="20" cy="30" r="1" fill="#D4C4A8" opacity="0.3"/>
      <circle cx="60" cy="70" r="1" fill="#D4C4A8" opacity="0.3"/>
      <circle cx="80" cy="20" r="1" fill="#D4C4A8" opacity="0.3"/>
    </pattern>
    
    <!-- Wood grain for hull -->
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0826D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6F47;stop-opacity:1" />
    </linearGradient>
    
    <!-- Water color -->
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7BA3A8;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#5B8287;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background - aged paper -->
  <rect width="1200" height="900" fill="url(#paper)"/>
  
  <!-- Decorative border - vintage frame -->
  <rect x="20" y="20" width="1160" height="860" fill="none" 
        stroke="#654321" stroke-width="8" rx="15"/>
  <rect x="30" y="30" width="1140" height="840" fill="none" 
        stroke="#8B6F47" stroke-width="2" rx="10"/>
  
  <!-- Title in vintage serif style -->
  <text x="600" y="80" font-family="Georgia, serif" font-size="48" 
        fill="#2C1810" text-anchor="middle" font-weight="bold" font-style="italic">
    Solo Fishing Configuration
  </text>
  <text x="600" y="110" font-family="Georgia, serif" font-size="20" 
        fill="#654321" text-anchor="middle">
    OSEP-16 Expedition Proa • Mounting Points &amp; Accessories
  </text>
  
  <!-- Water line suggestion -->
  <rect x="0" y="650" width="1200" height="250" fill="url(#water)" opacity="0.3"/>
  
  <!-- Main hull - side view with vintage aesthetic -->
  <g id="hull" transform="translate(150, 350)">
    <!-- Hull body - natural wood tone -->
    <path d="M 100,120 Q 250,100 500,95 Q 750,100 900,120 
             Q 750,160 500,165 Q 250,160 100,120 Z"
          fill="url(#wood)" stroke="#4A3728" stroke-width="3"/>
    
    <!-- Sheer line detail -->
    <path d="M 100,120 Q 250,100 500,95 Q 750,100 900,120"
          stroke="#654321" stroke-width="2" fill="none"/>
    
    <!-- Waterline -->
    <line x1="100" y1="140" x2="900" y2="140" 
          stroke="#5B8287" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
    
    <!-- Station markers - subtle -->
    <line x1="300" y1="102" x2="300" y2="158" stroke="#8B6F47" 
          stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
    <line x1="500" y1="95" x2="500" y2="165" stroke="#8B6F47" 
          stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
    <line x1="700" y1="102" x2="700" y2="158" stroke="#8B6F47" 
          stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  </g>
  
  <!-- Mounting point callouts - hand-drawn style -->
  
  <!-- Rod Holder #1 (Forward Port) -->
  <g id="rod-holder-1">
    <circle cx="400" cy="440" r="8" fill="#8B4513" stroke="#4A3728" stroke-width="2"/>
    <line x1="400" y1="440" x2="320" y2="380" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="180" y="340" width="130" height="50" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="245" y="360" font-family="Georgia, serif" font-size="12" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Rod Holder
    </text>
    <text x="245" y="375" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Forward Port
    </text>
    <text x="245" y="387" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type A Track
    </text>
  </g>
  
  <!-- Rod Holder #2 (Midship Port) -->
  <g id="rod-holder-2">
    <circle cx="600" cy="438" r="8" fill="#8B4513" stroke="#4A3728" stroke-width="2"/>
    <line x1="600" y1="438" x2="600" y2="320" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="530" y="280" width="140" height="50" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="600" y="300" font-family="Georgia, serif" font-size="12" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Rod Holders (2x)
    </text>
    <text x="600" y="315" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Midship Port/Stbd
    </text>
    <text x="600" y="327" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Adjustable, Type A
    </text>
  </g>
  
  <!-- Paddle Clip -->
  <g id="paddle-clip">
    <circle cx="800" cy="440" r="8" fill="#8B4513" stroke="#4A3728" stroke-width="2"/>
    <line x1="800" y1="440" x2="880" y2="380" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="840" y="340" width="120" height="50" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="900" y="360" font-family="Georgia, serif" font-size="12" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Paddle Clips
    </text>
    <text x="900" y="375" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Safety Required
    </text>
    <text x="900" y="387" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type A Track
    </text>
  </g>
  
  <!-- Anchor Cleat -->
  <g id="anchor-cleat">
    <circle cx="245" cy="468" r="8" fill="#C0C0C0" stroke="#4A3728" stroke-width="2"/>
    <line x1="245" y1="468" x2="150" y2="520" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="60" y="510" width="120" height="50" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="120" y="530" font-family="Georgia, serif" font-size="12" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Anchor Cleat
    </text>
    <text x="120" y="545" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Bow Position
    </text>
    <text x="120" y="557" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type A Track
    </text>
  </g>
  
  <!-- Fishfinder Mount -->
  <g id="fishfinder">
    <rect x="590" y="455" width="20" height="15" fill="#2C3E50" 
          stroke="#4A3728" stroke-width="2" rx="2"/>
    <line x1="600" y1="470" x2="680" y2="540" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="620" y="540" width="130" height="50" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="685" y="560" font-family="Georgia, serif" font-size="12" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Fishfinder
    </text>
    <text x="685" y="575" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Deck Center
    </text>
    <text x="685" y="587" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type D Recess
    </text>
  </g>
  
  <!-- Cooler Tie-Down -->
  <g id="cooler">
    <circle cx="950" cy="465" r="8" fill="#8B4513" stroke="#4A3728" stroke-width="2"/>
    <line x1="950" y1="465" x2="1020" y2="520" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="960" y="510" width="120" height="50" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="1020" y="530" font-family="Georgia, serif" font-size="12" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Cooler Strap
    </text>
    <text x="1020" y="545" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Aft Cockpit
    </text>
    <text x="1020" y="557" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type C Pad Eye
    </text>
  </g>
  
  <!-- Detailed inset - Track system -->
  <g id="track-detail" transform="translate(100, 700)">
    <rect x="0" y="0" width="300" height="150" fill="#FFF" fill-opacity="0.9" 
          stroke="#654321" stroke-width="3" rx="8"/>
    <text x="150" y="25" font-family="Georgia, serif" font-size="14" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Type A Track Detail
    </text>
    
    <!-- Track cross-section -->
    <rect x="30" y="45" width="240" height="12" fill="#C0C0C0" 
          stroke="#4A3728" stroke-width="2"/>
    <path d="M 35,57 L 35,70 L 50,70 L 50,57" fill="#8B6F47" 
          stroke="#4A3728" stroke-width="1.5"/>
    <circle cx="42" cy="63" r="3" fill="#4A3728"/>
    
    <text x="30" y="95" font-family="Georgia, serif" font-size="11" fill="#654321">
      • Aluminum T-track
    </text>
    <text x="30" y="112" font-family="Georgia, serif" font-size="11" fill="#654321">
      • 1/4-20 threaded
    </text>
    <text x="30" y="129" font-family="Georgia, serif" font-size="11" fill="#654321">
      • Sliding adjustments
    </text>
  </g>
  
  <!-- Legend box -->
  <g id="legend" transform="translate(850, 700)">
    <rect x="0" y="0" width="300" height="150" fill="#FFF" fill-opacity="0.9" 
          stroke="#654321" stroke-width="3" rx="8"/>
    <text x="150" y="25" font-family="Georgia, serif" font-size="14" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Mount Types
    </text>
    
    <circle cx="30" cy="50" r="6" fill="#8B4513" stroke="#4A3728" stroke-width="2"/>
    <text x="50" y="55" font-family="Georgia, serif" font-size="11" fill="#654321">
      Type A: Track (adjustable)
    </text>
    
    <circle cx="30" cy="75" r="6" fill="#C0C0C0" stroke="#4A3728" stroke-width="2"/>
    <text x="50" y="80" font-family="Georgia, serif" font-size="11" fill="#654321">
      Type B: Hardpoint (fixed)
    </text>
    
    <circle cx="30" cy="100" r="6" fill="#8B4513" stroke="#4A3728" stroke-width="2"/>
    <text x="50" y="105" font-family="Georgia, serif" font-size="11" fill="#654321">
      Type C: Pad eye (tie-down)
    </text>
    
    <rect x="24" y="118" width="12" height="10" fill="#2C3E50" 
          stroke="#4A3728" stroke-width="1.5" rx="2"/>
    <text x="50" y="127" font-family="Georgia, serif" font-size="11" fill="#654321">
      Type D: Recess (electronics)
    </text>
  </g>
  
  <!-- Bottom attribution -->
  <text x="600" y="880" font-family="Georgia, serif" font-size="12" 
        fill="#654321" text-anchor="middle" font-style="italic">
    OSEP-16 Open-Source Expedition Proa • 2025 • All measurements in inches
  </text>
</svg>
