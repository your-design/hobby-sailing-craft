<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- AMA (Outrigger) - Pop Art Illustration -->
  
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    
    <pattern id="dots" x="0" y="0" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="7.5" cy="7.5" r="2" fill="#FFF" opacity="0.4"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>
  
  <!-- Title -->
  <rect x="50" y="30" width="1100" height="100" fill="#0066CC" stroke="#000" stroke-width="6"/>
  <text x="600" y="90" font-family="Impact" font-size="48" 
        fill="#FFFF00" text-anchor="middle" font-weight="bold">
    AMA - OUTRIGGER FLOAT
  </text>
  <text x="600" y="115" font-family="Arial" font-size="20" 
        fill="#FFF" text-anchor="middle">
    12' BUOYANT PLATFORM • WATERTIGHT STORAGE • FISHING DECK
  </text>
  
  <!-- Side View of Ama -->
  <g id="ama-side" transform="translate(150, 200)">
    <!-- Ama hull - symmetrical, rounded -->
    <path d="M 50,100 Q 200,70 450,65 Q 700,70 850,100 
             Q 700,130 450,135 Q 200,130 50,100 Z"
          fill="#00CED1" stroke="#000" stroke-width="6"/>
    
    <!-- Halftone overlay -->
    <pattern id="ama-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="#FF1493" opacity="0.3"/>
    </pattern>
    <path d="M 50,100 Q 200,70 450,65 Q 700,70 850,100 
             Q 700,130 450,135 Q 200,130 50,100 Z"
          fill="url(#ama-dots)"/>
    
    <!-- Deck hatch outline -->
    <rect x="300" y="60" width="300" height="20" fill="none" 
          stroke="#FFF" stroke-width="4" stroke-dasharray="10,5"/>
    
    <!-- Interior sections shown with cutaway -->
    <g id="cutaway" opacity="0.7">
      <rect x="100" y="85" width="150" height="30" fill="#FFFF00" 
            stroke="#000" stroke-width="2"/>
      <text x="175" y="105" font-family="Arial" font-size="12" 
            fill="#000" text-anchor="middle">STORAGE</text>
      
      <rect x="300" y="85" width="300" height="30" fill="#FF6B35" 
            stroke="#000" stroke-width="2"/>
      <text x="450" y="105" font-family="Arial" font-size="12" 
            fill="#FFF" text-anchor="middle">GEAR COMPARTMENT (12 CU FT)</text>
      
      <rect x="650" y="85" width="150" height="30" fill="#FFFF00" 
            stroke="#000" stroke-width="2"/>
      <text x="725" y="105" font-family="Arial" font-size="12" 
            fill="#000" text-anchor="middle">FLOTATION</text>
    </g>
    
    <!-- Dimensions -->
    <line x1="50" y1="160" x2="850" y2="160" stroke="#FF1493" stroke-width="4"/>
    <polygon points="50,160 70,155 70,165" fill="#FF1493"/>
    <polygon points="850,160 830,155 830,165" fill="#FF1493"/>
    <text x="450" y="185" font-family="Impact" font-size="24" fill="#000" 
          text-anchor="middle" font-weight="bold">
      12' 0" LENGTH
    </text>
  </g>
  
  <!-- Cross-Section View -->
  <g id="ama-section" transform="translate(150, 400)">
    <rect x="350" y="-30" width="200" height="30" fill="#0066CC" stroke="#000" stroke-width="4"/>
    <text x="450" y="-8" font-family="Impact" font-size="18" fill="#FFF" 
          text-anchor="middle" font-weight="bold">
      CROSS-SECTION
    </text>
    
    <!-- Symmetrical rounded cross-section -->
    <ellipse cx="450" cy="60" rx="150" ry="60" 
             fill="#00CED1" stroke="#000" stroke-width="6"/>
    <ellipse cx="450" cy="60" rx="150" ry="60" 
             fill="url(#ama-dots)"/>
    
    <!-- Internal compartment -->
    <rect x="375" y="30" width="150" height="40" fill="none" 
          stroke="#FFF" stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- Width dimension -->
    <line x1="300" y1="140" x2="600" y2="140" stroke="#FF6B35" stroke-width="4"/>
    <polygon points="300,140 315,135 315,145" fill="#FF6B35"/>
    <polygon points="600,140 585,135 585,145" fill="#FF6B35"/>
    <text x="450" y="165" font-family="Impact" font-size="20" fill="#000" 
          text-anchor="middle" font-weight="bold">
      18" BEAM
    </text>
  </g>
  
  <!-- Feature Callouts -->
  <g id="features">
    <!-- Buoyancy burst -->
    <g transform="translate(100, 500)">
      <polygon points="50,0 70,-20 60,-5 85,-15 65,5 85,25 60,15 70,30" 
               fill="#FFFF00" stroke="#000" stroke-width="4"/>
      <text x="65" y="5" font-family="Impact" font-size="14" 
            fill="#FF1493" text-anchor="middle" font-weight="bold">
        400LBS
      </text>
      <text x="65" y="20" font-family="Impact" font-size="14" 
            fill="#FF1493" text-anchor="middle" font-weight="bold">
        FLOAT!
      </text>
    </g>
    
    <!-- Stand-on platform -->
    <circle cx="950" cy="300" r="70" fill="#FF6B35" stroke="#000" stroke-width="5"/>
    <text x="950" y="290" font-family="Impact" font-size="16" 
          fill="#FFF" text-anchor="middle" font-weight="bold">
      FISHING
    </text>
    <text x="950" y="310" font-family="Impact" font-size="16" 
          fill="#FFF" text-anchor="middle" font-weight="bold">
      PLAT-
    </text>
    <text x="950" y="330" font-family="Impact" font-size="16" 
          fill="#FFF" text-anchor="middle" font-weight="bold">
      FORM!
    </text>
  </g>
  
  <!-- Storage capacity graphic -->
  <g transform="translate(750, 550)">
    <rect x="0" y="0" width="200" height="150" fill="#FFFF00" 
          stroke="#000" stroke-width="5"/>
    <text x="100" y="30" font-family="Impact" font-size="24" 
          fill="#000" text-anchor="middle" font-weight="bold">
      STORAGE:
    </text>
    <text x="100" y="65" font-family="Impact" font-size="32" 
          fill="#FF1493" text-anchor="middle" font-weight="bold">
      12 CU FT
    </text>
    <text x="100" y="95" font-family="Arial" font-size="14" 
          fill="#000" text-anchor="middle">
      WATERTIGHT
    </text>
    <text x="100" y="115" font-family="Arial" font-size="14" 
          fill="#000" text-anchor="middle">
      3-5 DAY
    </text>
    <text x="100" y="135" font-family="Arial" font-size="14" 
          fill="#000" text-anchor="middle">
      EXPEDITION GEAR
    </text>
  </g>
  
  <!-- Copyright -->
  <text x="600" y="780" font-family="Arial" font-size="14" 
        fill="#000" text-anchor="middle">
    OSEP-16 Expedition Proa • Open-Source Design • 2025
  </text>
</svg>
