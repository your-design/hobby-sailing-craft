<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Vintage Outdoor Catalog Style - Sailing Configuration -->
  
  <defs>
    <pattern id="paper2" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#F4E8D0"/>
    </pattern>
    
    <linearGradient id="wood2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0826D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6F47;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5DEB3;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#D2B48C;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="900" fill="url(#paper2)"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="1160" height="860" fill="none" 
        stroke="#654321" stroke-width="8" rx="15"/>
  <rect x="30" y="30" width="1140" height="840" fill="none" 
        stroke="#8B6F47" stroke-width="2" rx="10"/>
  
  <!-- Title -->
  <text x="600" y="80" font-family="Georgia, serif" font-size="48" 
        fill="#2C1810" text-anchor="middle" font-weight="bold" font-style="italic">
    Family Sailing Configuration
  </text>
  <text x="600" y="110" font-family="Georgia, serif" font-size="20" 
        fill="#654321" text-anchor="middle">
    OSEP-16 Expedition Proa • Rigging &amp; Hardware Points
  </text>
  
  <!-- Hull with full rigging -->
  <g id="sailing-assembly" transform="translate(200, 280)">
    
    <!-- Main hull -->
    <path d="M 100,220 Q 250,200 400,195 Q 550,200 700,220 
             Q 550,260 400,265 Q 250,260 100,220 Z"
          fill="url(#wood2)" stroke="#4A3728" stroke-width="3"/>
    
    <!-- Mast -->
    <rect x="345" y="20" width="10" height="175" fill="#8B6F47" 
          stroke="#4A3728" stroke-width="2"/>
    
    <!-- Sail -->
    <path d="M 350,25 L 480,140 L 350,220 L 280,140 Z"
          fill="url(#sail)" stroke="#654321" stroke-width="2" opacity="0.85"/>
    
    <!-- Boom -->
    <line x1="350" y1="220" x2="350" y2="240" stroke="#8B6F47" stroke-width="6"/>
    
    <!-- Crossbeams (akas) -->
    <rect x="250" y="110" width="250" height="10" fill="#A0826D" 
          stroke="#4A3728" stroke-width="2"/>
    <rect x="250" y="180" width="250" height="10" fill="#A0826D" 
          stroke="#4A3728" stroke-width="2"/>
    
    <!-- Ama (outrigger) -->
    <ellipse cx="575" cy="145" rx="100" ry="30" fill="#A0826D" 
             stroke="#4A3728" stroke-width="2"/>
  </g>
  
  <!-- Mounting point callouts -->
  
  <!-- Mast Step -->
  <g id="mast-step">
    <rect x="540" y="470" width="20" height="20" fill="#8B4513" 
          stroke="#4A3728" stroke-width="3"/>
    <line x1="550" y1="490" x2="480" y2="550" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="350" y="540" width="140" height="60" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="420" y="562" font-family="Georgia, serif" font-size="13" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Mast Step
    </text>
    <text x="420" y="579" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Station 4.5 Centerline
    </text>
    <text x="420" y="593" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type B Hardpoint
    </text>
  </g>
  
  <!-- Sheet Blocks -->
  <g id="sheet-blocks">
    <circle cx="640" cy="490" r="8" fill="#C0C0C0" stroke="#4A3728" stroke-width="2"/>
    <line x1="640" y1="490" x2="720" y2="560" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="660" y="550" width="130" height="60" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="725" y="572" font-family="Georgia, serif" font-size="13" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Sheet Blocks
    </text>
    <text x="725" y="589" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Mainsheet System
    </text>
    <text x="725" y="603" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type A Track (4x)
    </text>
  </g>
  
  <!-- Tiller Mount -->
  <g id="tiller">
    <circle cx="840" cy="500" r="8" fill="#8B4513" stroke="#4A3728" stroke-width="2"/>
    <line x1="840" y1="500" x2="940" y2="560" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="880" y="550" width="130" height="60" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="945" y="572" font-family="Georgia, serif" font-size="13" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Tiller Mount
    </text>
    <text x="945" y="589" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Stern Quadrant
    </text>
    <text x="945" y="603" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type A Track
    </text>
  </g>
  
  <!-- Shroud Attachment -->
  <g id="shrouds">
    <rect x="440" y="445" width="16" height="16" fill="#8B4513" 
          stroke="#4A3728" stroke-width="3"/>
    <line x1="448" y1="461" x2="380" y2="540" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="250" y="530" width="140" height="60" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="320" y="552" font-family="Georgia, serif" font-size="13" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Shroud Points
    </text>
    <text x="320" y="569" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Mast Support (2x)
    </text>
    <text x="320" y="583" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type B Hardpoint
    </text>
  </g>
  
  <!-- Pylon Mounts (akas) -->
  <g id="pylon">
    <rect x="437" y="385" width="16" height="16" fill="#8B4513" 
          stroke="#4A3728" stroke-width="3"/>
    <line x1="445" y1="385" x2="445" y2="320" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="375" y="260" width="140" height="70" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="445" y="282" font-family="Georgia, serif" font-size="13" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Pylon Mounts
    </text>
    <text x="445" y="299" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Aka Attachment (2x)
    </text>
    <text x="445" y="313" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type B Hardpoint
    </text>
    <text x="445" y="326" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle">
      Stations 4 &amp; 6
    </text>
  </g>
  
  <!-- Trampoline Lacing -->
  <g id="trampoline">
    <circle cx="640" cy="395" r="8" fill="#8B4513" stroke="#4A3728" stroke-width="2"/>
    <line x1="640" y1="395" x2="740" y2="320" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="680" y="260" width="140" height="70" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="750" y="282" font-family="Georgia, serif" font-size="13" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Trampoline
    </text>
    <text x="750" y="299" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Mesh Lacing Points
    </text>
    <text x="750" y="313" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type A Track
    </text>
    <text x="750" y="326" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle">
      All 4 Aka Edges
    </text>
  </g>
  
  <!-- Safety Rail -->
  <g id="safety-rail">
    <circle cx="720" cy="490" r="8" fill="#C0C0C0" stroke="#4A3728" stroke-width="2"/>
    <line x1="720" y1="490" x2="880" y2="420" stroke="#4A3728" 
          stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="830" y="360" width="130" height="70" fill="#F4E8D0" 
          stroke="#654321" stroke-width="2" rx="5"/>
    <text x="895" y="382" font-family="Georgia, serif" font-size="13" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Safety Rail
    </text>
    <text x="895" y="399" font-family="Georgia, serif" font-size="10" 
          fill="#654321" text-anchor="middle">
      Windward Side
    </text>
    <text x="895" y="413" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle" font-style="italic">
      Type A Track
    </text>
    <text x="895" y="426" font-family="Georgia, serif" font-size="9" 
          fill="#654321" text-anchor="middle">
      Optional
    </text>
  </g>
  
  <!-- Installation Notes -->
  <g id="notes" transform="translate(80, 680)">
    <rect x="0" y="0" width="500" height="180" fill="#FFF" fill-opacity="0.9" 
          stroke="#654321" stroke-width="3" rx="8"/>
    <text x="250" y="28" font-family="Georgia, serif" font-size="16" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Installation Priority
    </text>
    
    <text x="20" y="55" font-family="Georgia, serif" font-size="12" fill="#654321" font-weight="bold">
      Phase 1 (During Build):
    </text>
    <text x="30" y="73" font-family="Georgia, serif" font-size="11" fill="#654321">
      • Mast step hardpoint (structural)
    </text>
    <text x="30" y="89" font-family="Georgia, serif" font-size="11" fill="#654321">
      • Shroud attachment points (2x)
    </text>
    <text x="30" y="105" font-family="Georgia, serif" font-size="11" fill="#654321">
      • Pylon sockets for akas (2x)
    </text>
    
    <text x="20" y="130" font-family="Georgia, serif" font-size="12" fill="#654321" font-weight="bold">
      Phase 2 (Before Launch):
    </text>
    <text x="30" y="148" font-family="Georgia, serif" font-size="11" fill="#654321">
      • All track installations
    </text>
    <text x="30" y="164" font-family="Georgia, serif" font-size="11" fill="#654321">
      • Sheet blocks, cleats, tiller mount
    </text>
  </g>
  
  <!-- Hardware Detail -->
  <g id="hardware-detail" transform="translate(620, 680)">
    <rect x="0" y="0" width="520" height="180" fill="#FFF" fill-opacity="0.9" 
          stroke="#654321" stroke-width="3" rx="8"/>
    <text x="260" y="28" font-family="Georgia, serif" font-size="16" 
          fill="#2C1810" text-anchor="middle" font-weight="bold">
      Required Hardware (Sailing)
    </text>
    
    <text x="20" y="55" font-family="Georgia, serif" font-size="11" fill="#654321">
      <tspan font-weight="bold">Blocks &amp; Cleats:</tspan> 4x sheet blocks, 2x cam cleats
    </text>
    <text x="20" y="73" font-family="Georgia, serif" font-size="11" fill="#654321">
      <tspan font-weight="bold">Tiller:</tspan> Rudder assembly with hiking extension
    </text>
    <text x="20" y="91" font-family="Georgia, serif" font-size="11" fill="#654321">
      <tspan font-weight="bold">Rigging:</tspan> 1/4" Dacron line (100'), 3mm dyneema
    </text>
    <text x="20" y="109" font-family="Georgia, serif" font-size="11" fill="#654321">
      <tspan font-weight="bold">Safety:</tspan> Hiking straps, safety rail, trampoline
    </text>
    <text x="20" y="127" font-family="Georgia, serif" font-size="11" fill="#654321">
      <tspan font-weight="bold">Mast:</tspan> 20' aluminum tube with tabernacle
    </text>
    <text x="20" y="145" font-family="Georgia, serif" font-size="11" fill="#654321">
      <tspan font-weight="bold">Sail:</tspan> 140 sq ft crab claw (Dacron or Mylar)
    </text>
    <text x="20" y="163" font-family="Georgia, serif" font-size="11" fill="#654321">
      <tspan font-weight="bold">Total Cost:</tspan> ~$750 for all sailing hardware
    </text>
  </g>
  
  <!-- Bottom attribution -->
  <text x="600" y="880" font-family="Georgia, serif" font-size="12" 
        fill="#654321" text-anchor="middle" font-style="italic">
    OSEP-16 • Complete sailing configuration • See Bill of Materials for specifications
  </text>
</svg>
